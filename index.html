<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="Um buquê de rosas digitais em ASCII." />
    <title>Flores para Você</title>
  </head>
  <body>
    <main class="experience">
      <canvas class="experience__canvas" aria-hidden="true"></canvas>
      <button class="experience__save" type="button" aria-label="Compartilhar buquê" title="Compartilhar buquê" aria-expanded="false" aria-controls="save-menu">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v11m-4-4 4 4 4-4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
        </svg>
      </button>
      <div class="experience__save-menu" id="save-menu" hidden>
        <button class="experience__save-option" type="button" data-save="text">Copiar como texto</button>
        <button class="experience__save-option" type="button" data-save="png">Baixar PNG</button>
        <p class="experience__save-status" role="status" aria-live="polite"></p>
      </div>
      <header class="experience__intro">
        <h1>Flores para Você</h1>
        <p>que faz meu mundo florescer.</p>
      </header>
      <div class="experience__controls">
        <!-- <p class="experience__description">A unique bouquet of roses and delicate flowers blooms in ASCII.</p> -->
        <button class="experience__replay" type="button">Um novo buquê para você <span aria-hidden="true">↗</span></button>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
